[project]
name = "rigpilot"
dynamic = ["version"]
description = "Windows-first workstation inventory and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23", "referencing>=0.28.4"]

[project.urls]
Homepage = "https://github.com/Arturo6PR/rigpilot"
Repository = "https://github.com/Arturo6PR/rigpilot"
Changelog = "https://github.com/Arturo6PR/rigpilot/blob/main/CHANGELOG.md"

[project.scripts]
rigpilot = "rigpilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rigpilot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.force-include]
"docs/snapshot.schema.json" = "rigpilot/snapshot.schema.json"
"docs/assessment.schema.json" = "rigpilot/assessment.schema.json"
"docs/guidance.schema.json" = "rigpilot/guidance.schema.json"
"docs/policy.schema.json" = "rigpilot/policy.schema.json"
"docs/policy-config.schema.json" = "rigpilot/policy-config.schema.json"
