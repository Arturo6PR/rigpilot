[project]
name = "rigpilot"
version = "0.6.0"
description = "Windows-first workstation inventory and diagnostics"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23", "referencing>=0.28.4"]

[project.scripts]
rigpilot = "rigpilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.force-include]
"docs/snapshot.schema.json" = "rigpilot/snapshot.schema.json"
"docs/assessment.schema.json" = "rigpilot/assessment.schema.json"
"docs/guidance.schema.json" = "rigpilot/guidance.schema.json"
"docs/policy.schema.json" = "rigpilot/policy.schema.json"
