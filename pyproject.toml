[project]
name = "rigpilot"
version = "0.1.0"
description = "Windows-first workstation inventory and diagnostics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rigpilot = "rigpilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
