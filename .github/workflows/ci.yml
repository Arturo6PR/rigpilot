name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run repository checks (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\scripts\Test-RigPilot.ps1
      - name: Run repository checks (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\Test-RigPilot.ps1
      - name: Run pytest
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Check formatting
        run: .\.venv\Scripts\python.exe -m ruff format --check .
