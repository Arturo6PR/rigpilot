name: RigPilot

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rigpilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Apply RigPilot policy
        id: rigpilot
        uses: Arturo6PR/rigpilot@v1
        with:
          snapshot: examples/github-actions/current.json
          policy: examples/github-actions/rigpilot-policy.json
          report: rigpilot-assessment.json

      # The report remains in the workspace for later steps or an official artifact upload step.
      - name: Show RigPilot outputs
        if: always()
        shell: bash
        env:
          RIGPILOT_STATUS: ${{ steps.rigpilot.outputs.status }}
          RIGPILOT_PASSED: ${{ steps.rigpilot.outputs.passed }}
          RIGPILOT_WARNINGS: ${{ steps.rigpilot.outputs.warnings }}
          RIGPILOT_FAILED: ${{ steps.rigpilot.outputs.failed }}
          RIGPILOT_REPORT: ${{ steps.rigpilot.outputs.report }}
        run: |
          printf 'RigPilot status: %s (passed=%s, warnings=%s, failed=%s)\n' \
            "$RIGPILOT_STATUS" "$RIGPILOT_PASSED" "$RIGPILOT_WARNINGS" "$RIGPILOT_FAILED"
          printf 'RigPilot report: %s\n' "$RIGPILOT_REPORT"
